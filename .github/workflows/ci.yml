name: CI

on:
  push:
    branches: ["master"]
  pull_request:

# Read access is sufficient for this workflow
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        # Pin third-party workflow code while Dependabot tracks v7 updates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full history for secret scanning
          fetch-depth: 0

      - name: Set up Go
        # Pin third-party workflow code while Dependabot tracks v7 updates
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          # List files before failing the formatting check
          unformatted="$(git ls-files -z '*.go' | xargs -0 --no-run-if-empty gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Run focused tests with race detection
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Check JavaScript syntax
        run: |
          # Check syntax in both browser scripts
          node --check cmd/ghoney/static/app.js
          node --check cmd/ghoney/static/admin-login.js

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Scan source and history for secrets
        shell: bash
        run: |
          # Pin the scanner and redact any accidental findings in CI output
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner .
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .

      - name: Fuzz bounded detection decoding
        run: go test ./cmd/ghoney -run='^$' -fuzz=FuzzDetectionDecoding -fuzztime=15s -parallel=2

  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        # Use the same checkout version in both jobs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build hardened image
        run: docker build -t ghoney:ci .

      - name: Smoke test standard Docker isolation
        shell: bash
        run: |
          # Remove the container even if a check fails
          cleanup() { docker rm -f ghoney-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Use test credentials only for this container
          admin_user=ghoney
          admin_password=ci-admin-password

          docker run -d --name ghoney-ci \
            --env GHONEY_ADMIN_USER="$admin_user" \
            --env GHONEY_ADMIN_PASSWORD="$admin_password" \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --read-only \
            --memory=128m \
            --cpus=1 \
            --pids-limit=64 \
            -p 18080:8080 \
            -p 127.0.0.1:19090:9090 \
            ghoney:ci

          curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:19090/health
          curl --fail http://127.0.0.1:18080/admin >/dev/null
          curl --fail --user "$admin_user:$admin_password" http://127.0.0.1:19090/dashboard >/dev/null
          curl --fail --user "$admin_user:$admin_password" http://127.0.0.1:19090/metrics | grep -q ghoney_http_requests_total

          # Keep the dashboard off the public listener
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' http://127.0.0.1:18080/dashboard)" = "404"

      - name: Smoke test the custom seccomp profile
        shell: bash
        run: |
          # Check the allowlist with runc before runsc
          secret_directory="$(mktemp -d)"
          secret_file="$secret_directory/admin-password"
          cleanup() {
            docker rm -f ghoney-seccomp >/dev/null 2>&1 || true
            rm -f "$secret_file"
            rmdir "$secret_directory"
          }
          trap cleanup EXIT
          # Use test credentials only for this container
          admin_user=ghoney
          admin_password=ci-admin-password
          printf '%s\n' "$admin_password" > "$secret_file"
          chmod 644 "$secret_file"

          docker run -d --name ghoney-seccomp \
            --env GHONEY_ADMIN_USER="$admin_user" \
            --env GHONEY_ADMIN_PASSWORD_FILE=/run/secrets/ghoney_admin_password \
            --mount type=bind,source="$secret_file",target=/run/secrets/ghoney_admin_password,readonly \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp="$PWD/seccomp.json" \
            --read-only \
            --memory=128m \
            --cpus=1 \
            --pids-limit=64 \
            -p 18080:8080 \
            -p 127.0.0.1:19090:9090 \
            ghoney:ci

          curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:19090/health
          # Confirm that rejected credentials still reach telemetry
          test "$(curl --output /dev/null --silent --write-out '%{http_code}' \
            --request POST http://127.0.0.1:18080/api/v1/auth \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "u=' OR 1=1 --")" = "401"
          curl --fail --user "$admin_user:$admin_password" http://127.0.0.1:19090/metrics | grep -q ghoney_honeypot_attacks_total

      - name: Install gVisor
        shell: bash
        run: |
          # Install runsc from its signed upstream repository
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'

      - name: Smoke test gVisor with custom seccomp
        shell: bash
        run: |
          # Run the documented runsc and Seccomp combination
          cleanup() { docker rm -f ghoney-runsc >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Use test credentials only for this container
          admin_user=ghoney
          admin_password=ci-admin-password

          docker run -d --name ghoney-runsc \
            --env GHONEY_ADMIN_USER="$admin_user" \
            --env GHONEY_ADMIN_PASSWORD="$admin_password" \
            --runtime=runsc \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp="$PWD/seccomp.json" \
            --read-only \
            --memory=128m \
            --cpus=1 \
            --pids-limit=64 \
            -p 18080:8080 \
            -p 127.0.0.1:19090:9090 \
            ghoney:ci

          curl --retry 20 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:19090/health
          curl --fail http://127.0.0.1:18080/.git/config >/dev/null
          curl --fail --user "$admin_user:$admin_password" http://127.0.0.1:19090/dashboard >/dev/null
